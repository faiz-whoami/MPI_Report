<section class="app-page" ng-cloak>
    <header class="page-heading"><div><p class="eyebrow">Job records</p><h1>Corrective Actions</h1></div><a class="btn btn-primary" href="#/corrective-actions/create">Add action</a></header>
    <div class="alert alert-danger" ng-if="vm.error">{{ vm.error }}</div>
    <div class="table-responsive data-table-wrap">
        <table class="table table-striped table-bordered data-table">
            <thead><tr><th>Title</th><th>Criticality</th><th>Status</th><th>Due date</th></tr></thead>
            <tbody>
                <tr ng-repeat="item in vm.items track by item.CorrectiveActionId"><td>{{ item.Title }}</td><td>{{ item.Criticality }}</td><td><span class="status-label" ng-class="{'status-open': item.Status === 'Open', 'status-closed': item.Status === 'Closed'}">{{ item.Status }}</span></td><td>{{ item.DueDate | date:'dd-MMM-yyyy' }}</td></tr>
                <tr ng-if="!vm.error && !vm.items.length"><td colspan="4" class="empty-state">No corrective actions for this job.</td></tr>
            </tbody>
        </table>
    </div>
</section>
