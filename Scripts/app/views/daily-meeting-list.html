<section class="app-page" ng-cloak>
    <header class="page-heading"><div><p class="eyebrow">Job records</p><h1>Daily Meetings</h1></div><a class="btn btn-primary" href="#/daily-meetings/create">Add meeting</a></header>
    <div class="alert alert-danger" ng-if="vm.error">{{ vm.error }}</div>
    <div class="table-responsive data-table-wrap">
        <table class="table table-striped table-bordered data-table">
            <thead><tr><th>Date</th><th>Description</th><th>Signatures</th></tr></thead>
            <tbody>
                <tr ng-repeat="item in vm.items track by item.DailyMeetingId"><td>{{ item.MeetingDate | date:'dd-MMM-yyyy' }}</td><td>{{ item.Description }}</td><td>{{ item.Signatures }}</td></tr>
                <tr ng-if="!vm.error && !vm.items.length"><td colspan="3" class="empty-state">No daily meetings for this job.</td></tr>
            </tbody>
        </table>
    </div>
</section>
