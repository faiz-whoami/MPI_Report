<section class="app-page form-page" ng-cloak>
    <header class="page-heading"><div><p class="eyebrow">Job action</p><h1>Add corrective action</h1></div><a class="btn btn-default" href="#/corrective-actions">Back to actions</a></header>
    <div class="alert alert-danger" ng-if="vm.error">{{ vm.error }}</div>
    <form name="actionForm" class="form-horizontal form-surface" ng-submit="vm.save()" novalidate>
        <div class="form-group" ng-class="{'has-error': vm.errors.Title}"><label class="col-sm-3 control-label" for="action-title">Title</label><div class="col-sm-7"><input class="form-control" id="action-title" ng-model="vm.action.Title" maxlength="200" required /><span class="field-error" ng-repeat="message in vm.errors.Title">{{ message }}</span></div></div>
        <div class="form-group"><label class="col-sm-3 control-label" for="action-description">Description</label><div class="col-sm-7"><textarea class="form-control" id="action-description" rows="4" ng-model="vm.action.Description"></textarea></div></div>
        <div class="form-group"><label class="col-sm-3 control-label" for="action-criticality">Criticality</label><div class="col-sm-7"><select class="form-control" id="action-criticality" ng-model="vm.action.Criticality" ng-options="value for value in vm.criticalities"></select></div></div>
        <div class="form-group"><label class="col-sm-3 control-label" for="action-status">Status</label><div class="col-sm-7"><select class="form-control" id="action-status" ng-model="vm.action.Status" ng-options="value for value in vm.statuses"></select></div></div>
        <div class="form-group"><label class="col-sm-3 control-label" for="action-due-date">Due date</label><div class="col-sm-7"><input class="form-control" id="action-due-date" type="date" ng-model="vm.action.DueDate" /></div></div>
        <div class="form-group"><label class="col-sm-3 control-label" for="action-closed-comments">Closed comments</label><div class="col-sm-7"><textarea class="form-control" id="action-closed-comments" rows="3" ng-model="vm.action.ClosedComments"></textarea></div></div>
        <div class="form-actions col-sm-offset-3"><button class="btn btn-primary" type="submit" ng-disabled="actionForm.$invalid">Save action</button><a class="btn btn-link" href="#/corrective-actions">Cancel</a></div>
    </form>
</section>
