<section class="app-page" ng-cloak>
    <header class="page-heading"><div><p class="eyebrow">Directory</p><h1>Customers</h1></div><a class="btn btn-primary" href="#/customers/create">Add customer</a></header>
    <form class="filter-bar form-inline" ng-submit="vm.load()">
        <div class="form-group"><label for="customer-search">Search</label><input class="form-control" id="customer-search" ng-model="vm.search" placeholder="Name, email, or phone" /></div>
        <div class="form-group"><label for="customer-status">Status</label><select class="form-control" id="customer-status" ng-model="vm.status"><option value="active">Active</option><option value="inactive">Inactive</option><option value="all">All</option></select></div>
        <button class="btn btn-default" type="submit">Apply</button>
    </form>
    <div class="alert alert-danger" ng-if="vm.error">{{ vm.error }}</div>
    <div class="table-responsive data-table-wrap">
        <table class="table table-striped table-bordered data-table">
            <thead><tr><th>Customer</th><th>Email</th><th>Phone</th><th>Status</th><th class="actions-column">Actions</th></tr></thead>
            <tbody>
                <tr ng-repeat="customer in vm.customers track by customer.CustomerId"><td>{{ customer.Name }}</td><td>{{ customer.Email }}</td><td>{{ customer.Phone }}</td><td>{{ customer.IsActive ? 'Active' : 'Inactive' }}</td><td class="row-actions"><a ng-href="#/customers/{{ customer.CustomerId }}">Details</a><a ng-href="#/customers/{{ customer.CustomerId }}/edit">Edit</a><button class="btn btn-link btn-link-danger" type="button" ng-click="vm.remove(customer)">Delete</button></td></tr>
                <tr ng-if="!vm.error && !vm.customers.length"><td colspan="5" class="empty-state">No customers found.</td></tr>
            </tbody>
        </table>
    </div>
</section>
