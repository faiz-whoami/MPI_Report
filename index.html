<!DOCTYPE html>
<html lang="en" ng-app="mpiApp">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="./" />
    <title>Inspections Track</title>
    <link rel="stylesheet" href="Content/bootstrap.css" />
    <link rel="stylesheet" href="Content/Site.css" />
    <link rel="stylesheet" href="Content/app.css" />
    <script>
        window.mpiAppConfig = {
            templateRoot: "Scripts/app/views/",
            apiRoot: "api/",
            reportUrl: "Report/MPI",
            initialRoute: "/dashboard"
        };
    </script>
</head>
<body ng-controller="AppController as app">
    <div class="navbar navbar-inverse navbar-fixed-top" ng-if="app.authenticated">
            <div class="container">
                <div class="navbar-header">
                    <button type="button" class="navbar-toggle" data-toggle="collapse" data-target=".navbar-collapse">
                        <span class="icon-bar"></span>
                        <span class="icon-bar"></span>
                        <span class="icon-bar"></span>
                    </button>
                    <a class="navbar-brand" href="#/dashboard">Inspections Track</a>
                </div>
                <div class="navbar-collapse collapse">
                    <ul class="nav navbar-nav">
                        <li><a href="#/dashboard">Dashboard</a></li>
                        <li><a href="#/inventory">Inventory</a></li>
                        <li><a href="#/checklists">Checklists</a></li>
                        <li><a href="#/corrective-actions">Corrective Actions</a></li>
                        <li><a href="#/daily-meetings">Daily Meetings</a></li>
                        <li><a href="#/reports">MPI Reports</a></li>
                        <li><a href="#/customers">Customers</a></li>
                    </ul>
                    <ul class="nav navbar-nav navbar-right">
                        <li><a href="#/dashboard">{{ app.username }}</a></li>
                        <li><a href="" ng-click="app.logout()">Logout</a></li>
                    </ul>
                </div>
            </div>
    </div>
    <div class="container body-content" ng-class="{'login-page': !app.authenticated}">
        <div class="alert alert-info" ng-if="app.notice">{{ app.notice }}</div>
        <main id="app-view" ng-view></main>
        <hr ng-if="app.authenticated" />
        <footer ng-if="app.authenticated"><p>&#169; 2026 - Sky Soft Connections / Inspections Track</p></footer>
    </div>
    <script src="Scripts/jquery-3.4.1.js"></script>
    <script src="Scripts/bootstrap.js"></script>
    <script src="Scripts/vendor/angular-1.8.2.min.js"></script>
    <script src="Scripts/vendor/angular-route-1.8.2.min.js"></script>
    <script src="Scripts/app/app.js"></script>
    <script src="Scripts/app/api-service.js"></script>
    <script src="Scripts/app/app-controller.js"></script>
    <script src="Scripts/app/dashboard-controller.js"></script>
    <script src="Scripts/app/operations-controller.js"></script>
    <script src="Scripts/app/customer-controller.js"></script>
    <script src="Scripts/app/report-controller.js"></script>
    <script src="Scripts/app/login-controller.js"></script>
</body>
</html>
